<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tour Virtual 360°</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
    }
    #panorama {
      width: 100%;
      height: 100dvh;
    }
  </style>
</head>
<body>
  <div id="panorama"></div>
  <script>
    // Função que calcula os limites ideais conforme a orientação da tela
    function obterLimitesZoom() {
      const telaEmPe = window.innerHeight > window.innerWidth;

      if (telaEmPe) {
        // Celular em pé (Retrato): zoom mais fechado para não sobrar preto em cima/baixo
        return { hfov: 55, maxHfov: 60, minHfov: 35 };
      } else {
        // Computador ou celular deitado (Paisagem): visão mais aberta e confortável
        return { hfov: 95, maxHfov: 105, minHfov: 45 };
      }
    }

    const limitesIniciais = obterLimitesZoom();

    // Inicia o visualizador com os valores detectados
    const viewer = pannellum.viewer('panorama', {
      "type": "equirectangular",
      "panorama": "garagem.jpg",
      "autoLoad": true,
      "haov": 360,
      "vaov": 122,
      "minPitch": -20,
      "maxPitch": 20,
      "hfov": limitesIniciais.hfov,
      "maxHfov": limitesIniciais.maxHfov,
      "minHfov": limitesIniciais.minHfov,
      "showZoomCtrl": false
    });

    // Atualiza automaticamente se o usuário girar o celular ou redimensionar a janela
    window.addEventListener('resize', () => {
      const novosLimites = obterLimitesZoom();
      viewer.setHfovBounds([novosLimites.minHfov, novosLimites.maxHfov]);

      // Se o zoom atual ficou maior que o novo limite permitido, corrige na hora
      if (viewer.getHfov() > novosLimites.maxHfov) {
        viewer.setHfov(novosLimites.maxHfov);
      }
    });
  </script>
</body>
</html>
